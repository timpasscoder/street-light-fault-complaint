<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Complaint Submitted</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='form.css') }}">

    <style>

        .success-box {

            margin-top: 100px;

            background: rgba(255,255,255,0.75);

            padding: 40px;

            border-radius: 15px;

            text-align: center;

            width: 80%;

            max-width: 600px;

            box-shadow: 0px 0px 15px rgba(0,0,0,0.3);
        }

        .success-box h1 {

            color: rgb(3, 3, 3);

            font-size: 40px;
        }

        .success-box h2 {

            color: #222;
        }

        .success-box p {

            font-size: 20px;

            margin-top: 20px;
        }

        .complaint-id {

            color: red;

            font-weight: bold;

            font-size: 30px;

            margin-top: 10px;
        }

        .btn {

            margin-top: 20px;

            padding: 12px 25px;

            background: black;

            color: white;

            border: none;

            border-radius: 8px;

            text-decoration: none;

            font-size: 18px;

            cursor: pointer;

            display: inline-block;
        }

        .btn:hover {

            background: #6d6666;
        }

        #copyMessage {

            color: rgb(191, 15, 15);

            font-size: 18px;

            margin-top: 15px;

            display: none;
        }

    </style>

</head>

<body>

<div class="success-box">

    <h1>Complaint Submitted Successfully ✅</h1>

    <h2>Thank You for Reporting</h2>

    <p>
        Your Complaint ID:
    </p>

    <div class="complaint-id" id="complaintID">
        {{ complaint_id }}
    </div>

    <button class="btn" onclick="copyID()">
        Copy Complaint ID
    </button>

    <p id="copyMessage">
        Complaint ID Copied Successfully ✅
    </p>

    <br>

    <a href="/" class="btn">
        Submit Another Complaint
    </a>

</div>

<script>

function copyID() {

    let complaintID =
        document.getElementById("complaintID").innerText;

    navigator.clipboard.writeText(complaintID);

    document.getElementById("copyMessage").style.display = "block";
}

</script>

<footer>

    <h2 id="slogan">
        “Ek Kadam Aapka, Roshni Sabke Liye”
    </h2>

    <p>
        © 2026 Street Light Complaint System
    </p>

    <p>
        <b>“Bright Streets, Better India”</b>
    </p>

</footer>
</body>
</html>
