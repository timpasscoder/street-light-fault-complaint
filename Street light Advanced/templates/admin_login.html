<!DOCTYPE html>
<html>

<head>

<title>Admin Login</title>

<style>

body{

background:#f2f2f2;

text-align:center;

padding-top:120px;

font-family:Arial;

}

.login-box{

background:white;

width:350px;

margin:auto;

padding:30px;

border-radius:15px;

box-shadow:0 0 15px rgba(0,0,0,0.2);

}

input{

width:90%;

padding:12px;

margin:10px;

}

button{

padding:10px 20px;

cursor:pointer;

}

.error{

color:red;

}

</style>

</head>

<body>

<div class="login-box">

<h1>

Admin Login

</h1>

<form method="POST">

<input
type="password"
name="password"
placeholder="Enter Admin Password"
required>

<br>

<button>

Login

</button>

</form>

{% if error %}

<p class="error">

{{ error }}

</p>

{% endif %}

</div>

</body>

</html>
